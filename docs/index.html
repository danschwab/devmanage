<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
        <title>Top Shelf Exhibits</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add_photo_alternate,arrow_back,arrow_downward_alt,arrow_upward_alt,backspace,bookmark,calendar_month,cell_merge,chevron_left,chevron_right,close,compress,crop,dark_mode,delete,edit_note,expand,expand_content,filter_list,grid_view,history,imagesmode,info,keep,keep_off,light_mode,more_vert,print,restore_from_trash,settings,share,star,swap_vert,table,timeline,visibility,visibility_off,warning" />
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/browser.css">
        <link rel="icon" href="assets/favicon.png" />
        <meta name="google-site-verification" content="RQVP29WC9y-bnMCZw06liZbkgi3TDgWLYM5bYigVPTc" />
        <!-- Vue 3.5.45, served from the repo: no third-party script runs on this origin (docs/notes/auth-audit-findings.md) -->
        <script src="js/vendor/vue.global.prod.js"></script>
        <script src="js/google_sheets_services/config.js"></script>
        
        <!-- Initialize deployment version early to detect stale code caching -->
        <script>
            // Room to list every file the page loads (the update banner's refresh re-downloads them)
            performance.setResourceTimingBufferSize(2000);
            (async () => {
                try {
                    // Use cache-busting query param to ensure version.json is always fresh from server
                    const response = await fetch('./version.json?v=' + Date.now());
                    const versionData = await response.json();
                    window.__deployedVersion = versionData.version;
                    // console.log('[Version] Deployed version fetched:', versionData.version);
                } catch (err) {
                    console.warn('[Version] Failed to fetch version.json:', err.message);
                }
            })();
        </script>
        
        <script type="module" src="js/application/app.js"></script>
    </head>
    <body>
        <!-- Vue app will mount here -->
        <div id="app-content">
            <div class="empty-message">if the app does not load, refresh the page</div>
        </div>
    </body>
</html>
